<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Racing Car Builder — Prototype 01</title>
<style>
body{margin:0;background:#101820;color:white;font-family:system-ui;text-align:center}h1{font-size:22px;margin:18px 0 4px}p{color:#c5d1db;margin:6px 12px}canvas{width:min(96vw,700px);height:370px;touch-action:none;background:linear-gradient(#263847,#111a24);border-radius:14px;margin-top:12px}button{font-size:17px;border:0;border-radius:10px;padding:12px 17px;margin:7px;background:#d8a84b;color:#171717;font-weight:bold}.parts{max-width:700px;margin:auto}.status{min-height:28px;color:#f5d78d}
</style></head><body><h1>Racing Car Builder</h1><p>Prototype 01 — touch to rotate the chassis, then fit four wheels.</p><canvas id="scene" width="800" height="440"></canvas><div class="status" id="status">Select a wheel below to fit it.</div><div class="parts" id="parts"></div><button id="reset">Reset build</button>
<script>
const c=document.getElementById('scene'),ctx=c.getContext('2d'),status=document.getElementById('status'),parts=document.getElementById('parts');
let angle=-.45,installed=[false,false,false,false],drag=false,lastX=0;
const names=['Front left','Front right','Rear left','Rear right'];
function project(x,y,z){let a=angle,xx=x*Math.cos(a)-z*Math.sin(a),zz=x*Math.sin(a)+z*Math.cos(a);return [400+xx*100,230+zz*44-y*85]}
function poly(points,fill,stroke='#8fa4b4'){ctx.beginPath();points.forEach((p,i)=>{let q=project(...p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
function circle(x,y,z,r,color){let p=project(x,y,z);ctx.beginPath();ctx.ellipse(p[0],p[1],r*80,r*48,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#b8c2c8';ctx.stroke()}
function draw(){ctx.clearRect(0,0,800,440);ctx.fillStyle='#304252';ctx.fillRect(0,330,800,110);ctx.strokeStyle='#415362';for(let i=0;i<800;i+=70){ctx.beginPath();ctx.moveTo(i,330);ctx.lineTo(i-65,440);ctx.stroke()}
poly([[-.42,0,-1.35],[.42,0,-1.35],[.56,0,1.3],[-.56,0,1.3]],'#b9c2c9');
poly([[-.2,-.13,-1.9],[.2,-.13,-1.9],[.35,-.13,-1.15],[-.35,-.13,-1.15]],'#c94c34');
poly([[-.72,-.03,-1.18],[.72,-.03,-1.18],[.72,-.03,-.98],[-.72,-.03,-.98]],'#d9e0e5');
poly([[-.82,-.03,1.05],[.82,-.03,1.05],[.82,-.03,1.28],[-.82,-.03,1.28]],'#d9e0e5');
circle(0,-.1,.35,.38,'#1a2630');
const spots=[[-.85,0,-1.05],[.85,0,-1.05],[-.95,0,1.17],[.95,0,1.17]];
spots.forEach((p,i)=>{if(installed[i])circle(...p,.34,'#15191c');else circle(...p,.12,'#e4ad4e')});
ctx.fillStyle='#fff';ctx.font='18px system-ui';ctx.fillText('Touch and drag to rotate',22,34);
ctx.fillText(installed.filter(Boolean).length+'/4 wheels fitted',22,64)}
function update(){parts.innerHTML='';names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=(installed[i]?'✓ ':'Fit ')+n;b.disabled=installed[i];b.style.opacity=installed[i]?.45:1;b.onclick=()=>{installed[i]=true;status.textContent=n+' wheel fitted.';if(installed.every(Boolean))status.textContent='All four wheels fitted! Prototype test complete.';update();draw()};parts.appendChild(b)});}
c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-lastX)*.008;lastX=e.clientX;draw()}});c.addEventListener('pointerup',()=>drag=false);
document.getElementById('reset').onclick=()=>{installed=[false,false,false,false];angle=-.45;status.textContent='Select a wheel below to fit it.';update();draw()};update();draw();
</script></body></html>
